# Builds Orbit64 for macOS, Linux, Windows, FreeBSD, OpenBSD, NetBSD,
# and multiple architectures (x64, ARM64, x86 32-bit, ARMv7, RISC-V 64) on every push.
#
#   push to main     -> a new release v<major>.<minor>.<commits on main>; major.minor
#                       come from project(VERSION) in CMakeLists.txt
#   push of a v* tag -> a release for that tag (e.g. v2.0.0)
#   any other push   -> (nightly and every other branch) binaries only as workflow
#                       artifacts in the Actions tab, kept 14 days, no release page
#
# SDL3 is built from source and linked statically, so every archive holds a
# single self-contained executable. BSD systems (FreeBSD, OpenBSD, NetBSD)
# build inside QEMU VMs on Ubuntu runners.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # The project page (pages.yml) doesn't need a build or a release.
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main run halfway through publishing its release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
            shell: bash
            configure: >-
              -G Ninja
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            exe: out/orbit64
          - name: linux-x64
            os: ubuntu-22.04
            shell: bash
            configure: >-
              -G Ninja
              -DCMAKE_C_COMPILER=gcc-12
              -DCMAKE_CXX_COMPILER=g++-12
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            exe: out/orbit64
          - name: linux-arm64
            os: ubuntu-22.04-arm
            shell: bash
            configure: >-
              -G Ninja
              -DCMAKE_C_COMPILER=gcc-12
              -DCMAKE_CXX_COMPILER=g++-12
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            exe: out/orbit64
          # MinGW-w64 (GCC) as with the Makefile: the core uses GCC builtins MSVC lacks.
          - name: windows-x64
            os: windows-2022
            shell: msys2 {0}
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS=-static
            exe: out/orbit64.exe
            msystem: UCRT64
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-cmake
              mingw-w64-ucrt-x86_64-ninja
          # Windows x86 (32-bit MinGW-w64 GCC)
          - name: windows-x86
            os: windows-2022
            shell: msys2 {0}
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS=-static
            exe: out/orbit64.exe
            msystem: MINGW32
            packages: >-
              mingw-w64-i686-gcc
              mingw-w64-i686-cmake
              mingw-w64-i686-ninja
          # MSYS2 has no GCC for Windows on ARM; its CLANGARM64 environment
          # (clang + libc++, still MinGW-w64 headers and GCC builtins) is used.
          - name: windows-arm64
            os: windows-11-arm
            shell: msys2 {0}
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS=-static
            exe: out/orbit64.exe
            msystem: CLANGARM64
            packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-cmake
              mingw-w64-clang-aarch64-ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install MinGW-w64 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-12 g++-12 \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Configure
        run: >-
          cmake -S . -B out
          -DCMAKE_BUILD_TYPE=Release
          -DORBIT64_VENDOR_SDL3=ON
          -DORBIT64_SDL3_STATIC=ON
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build out --config Release --parallel

      # Runs the same guest programs through the interpreter and the JIT and
      # diffs the results, so a recompiler broken on one host (e.g. ARM64
      # Linux/Windows, where the W^X path differs from macOS) fails the build.
      - name: JIT self-test
        run: |
          cmake --build out --config Release --target jit_selftest
          ./out/jit_selftest

      - name: Package
        run: |
          mkdir -p dist/orbit64
          cp "${{ matrix.exe }}" README.md dist/orbit64/
          mkdir -p dist/orbit64/roms && cp roms/README.md dist/orbit64/roms/
          cd dist
          case "${{ runner.os }}" in
            Linux)   tar -czf orbit64-${{ matrix.name }}.tar.gz orbit64 ;;
            macOS)   ditto -c -k --keepParent orbit64 orbit64-${{ matrix.name }}.zip ;;
            Windows) cmake -E tar cf orbit64-${{ matrix.name }}.zip --format=zip orbit64 ;;
          esac
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-${{ matrix.name }}
          path: dist/orbit64-${{ matrix.name }}.*
          retention-days: 14

  # Linux musl / Alpine builds: completely portable static executables that run
  # on any Linux distribution (Alpine, Void, Arch, Debian, Ubuntu) without glibc dependencies.
  linux-musl:
    name: linux-musl-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-22.04
          - arch: arm64
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build in Alpine
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work alpine:latest sh -c "
            apk update && apk add --no-cache cmake ninja g++ gcc git pkgconf linux-headers samurai \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
              libxkbcommon-dev wayland-dev libdecor-dev mesa-dev alsa-lib-dev \
              pulseaudio-dev pipewire-dev libxscrnsaver-dev
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON \
              -DSDL_X11_XSCRNSAVER=OFF \
              '-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc'
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-linux-musl-${{ matrix.arch }}.tar.gz orbit64
          "
      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-linux-musl-${{ matrix.arch }}
          path: dist/orbit64-linux-musl-${{ matrix.arch }}.tar.gz
          retention-days: 14

  # Linux 32-bit x86 (i686) builds in a 32-bit Debian container.
  linux-x86:
    name: linux-x86
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build in 32-bit Debian
        run: |
          docker run --rm -v ${{ github.workspace }}:/work -w /work i386/debian:bookworm sh -c "
            apt-get update && apt-get install -y --no-install-recommends \
              cmake ninja-build gcc g++ git pkg-config ca-certificates \
              libasound2-dev libpulse-dev libpipewire-0.3-dev \
              libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
              libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
              libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
              libdbus-1-dev libudev-dev
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON \
              '-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc'
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-linux-x86.tar.gz orbit64
          "
      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-linux-x86
          path: dist/orbit64-linux-x86.tar.gz
          retention-days: 14

  # Linux ARMv7 (32-bit armhf) and RISC-V 64 via QEMU user emulation
  linux-emulated:
    name: linux-${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: armhf
            image: arm32v7/debian:bookworm
            platform: linux/arm/v7
          - name: riscv64
            image: riscv64/debian:sid
            platform: linux/riscv64
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Build
        run: |
          docker run --platform ${{ matrix.platform }} --rm -v ${{ github.workspace }}:/work -w /work ${{ matrix.image }} sh -c "
            apt-get update && apt-get install -y --no-install-recommends \
              cmake ninja-build gcc g++ git pkg-config ca-certificates \
              libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
              libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
              libxkbcommon-dev libwayland-dev libdecor-0-dev libdrm-dev \
              libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
              libdbus-1-dev libudev-dev
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON \
              '-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc'
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-linux-${{ matrix.name }}.tar.gz orbit64
          "
      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-linux-${{ matrix.name }}
          path: dist/orbit64-linux-${{ matrix.name }}.tar.gz
          retention-days: 14

  # GitHub has no FreeBSD runners: vmactions/freebsd-vm boots FreeBSD in QEMU on
  # an x86-64 Ubuntu runner (aarch64 is fully emulated, so expect a long build).
  # Built on 14.3 so the binary also runs on 15.x. Base clang + libc++.
  freebsd:
    name: freebsd-${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            vmarch: x86_64
          - arch: arm64
            vmarch: aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Build in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          arch: ${{ matrix.vmarch }}
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y cmake ninja pkgconf evdev-proto libinotify libudev-devd \
              libX11 libXext libXrandr libXcursor libXfixes libXi libXScrnSaver libXtst \
              libxkbcommon wayland wayland-protocols libdecor mesa-libs libglvnd \
              alsa-lib pulseaudio pipewire sndio dbus
          run: |
            set -e
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-freebsd-${{ matrix.arch }}.tar.gz orbit64 && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-freebsd-${{ matrix.arch }}
          path: dist/orbit64-freebsd-${{ matrix.arch }}.tar.gz
          retention-days: 14

  # OpenBSD 7.9 x64 build running inside QEMU on an Ubuntu runner.
  openbsd:
    name: openbsd-x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build in OpenBSD
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          arch: x86_64
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg_add cmake ninja pkgconf git curl
          run: |
            set -e
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON \
              -DCMAKE_PREFIX_PATH=/usr/X11R6
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-openbsd-x64.tar.gz orbit64 && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-openbsd-x64
          path: dist/orbit64-openbsd-x64.tar.gz
          retention-days: 14

  # NetBSD 10.0 x64 build running inside QEMU on an Ubuntu runner.
  netbsd:
    name: netbsd-x64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Build in NetBSD
        uses: vmactions/netbsd-vm@v1
        with:
          release: '10.0'
          arch: x86_64
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            /usr/sbin/pkg_add pkgin || true
            pkgin -y update || true
            pkgin -y install cmake ninja-build pkgconf mozilla-rootcerts-openssl git libX11 libXext libXrandr libXcursor libXfixes libXi libxkbcommon || true
          run: |
            set -e
            export PATH="/usr/pkg/bin:/usr/pkg/sbin:$PATH"
            cmake -S . -B out -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DORBIT64_VENDOR_SDL3=ON \
              -DORBIT64_SDL3_STATIC=ON \
              -DSDL_UNIX_CONSOLE=ON \
              -DCMAKE_PREFIX_PATH="/usr/X11R7;/usr/pkg" \
              -DCMAKE_INCLUDE_PATH="/usr/X11R7/include;/usr/pkg/include" \
              -DCMAKE_LIBRARY_PATH="/usr/X11R7/lib;/usr/pkg/lib"
            cmake --build out --config Release --parallel
            cmake --build out --config Release --target jit_selftest
            ./out/jit_selftest
            mkdir -p dist/orbit64/roms
            cp out/orbit64 README.md dist/orbit64/
            cp roms/README.md dist/orbit64/roms/
            cd dist && tar -czf orbit64-netbsd-x64.tar.gz orbit64 && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-netbsd-x64
          path: dist/orbit64-netbsd-x64.tar.gz
          retention-days: 14

  release:
    needs: [build, freebsd, openbsd, netbsd, linux-musl, linux-x86, linux-emulated]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="$GITHUB_REF_NAME"
          else
            base=$(sed -nE 's/^project\(orbit64 VERSION ([0-9]+)\.([0-9]+).*/\1.\2/p' CMakeLists.txt)
            ver="v${base}.$(git rev-list --count "$GITHUB_SHA")"
          fi
          if gh release view "$ver" > /dev/null 2>&1; then
            # Re-run of the same commit: refresh the binaries only.
            gh release upload "$ver" dist/* --clobber
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname --merged "$GITHUB_SHA" | grep -vx "$ver" | head -1 || true)
          {
            echo "Built from \`$(git rev-parse --short "$GITHUB_SHA")\` on $(date -u '+%Y-%m-%d')."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --max-count=100 --format='- %s (%h)' "$prev..$GITHUB_SHA"
            else
              git log -1 --format='- %s (%h)' "$GITHUB_SHA"
            fi
            echo
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows 10/11 x64 | \`orbit64-windows-x64.zip\` |"
            echo "| Windows 10/11 x86 (32-bit) | \`orbit64-windows-x86.zip\` |"
            echo "| Windows 11 ARM64 (e.g. Snapdragon X) | \`orbit64-windows-arm64.zip\` |"
            echo "| macOS 11+ (Apple Silicon and Intel) | \`orbit64-macos-universal.zip\` |"
            echo "| Linux x64 (glibc 2.35+, e.g. Ubuntu 22.04+) | \`orbit64-linux-x64.tar.gz\` |"
            echo "| Linux ARM64 (glibc 2.35+, e.g. Ubuntu 22.04+, Raspberry Pi OS 64-bit bookworm+) | \`orbit64-linux-arm64.tar.gz\` |"
            echo "| Linux x86 32-bit (Debian/Ubuntu 32-bit) | \`orbit64-linux-x86.tar.gz\` |"
            echo "| Linux ARMv7 32-bit (Raspberry Pi OS 32-bit) | \`orbit64-linux-armhf.tar.gz\` |"
            echo "| Linux RISC-V 64 | \`orbit64-linux-riscv64.tar.gz\` |"
            echo "| Linux x64 Musl (static, Alpine / Void / any Linux) | \`orbit64-linux-musl-x64.tar.gz\` |"
            echo "| Linux ARM64 Musl (static, Alpine / Void / any Linux) | \`orbit64-linux-musl-arm64.tar.gz\` |"
            echo "| FreeBSD 14.3+ x64 | \`orbit64-freebsd-x64.tar.gz\` |"
            echo "| FreeBSD 14.3+ ARM64 | \`orbit64-freebsd-arm64.tar.gz\` |"
            echo "| OpenBSD 7.9+ x64 | \`orbit64-openbsd-x64.tar.gz\` |"
            echo "| NetBSD 10.0+ x64 | \`orbit64-netbsd-x64.tar.gz\` |"
            echo
            echo "macOS: the binary is not notarized. After unpacking run \`xattr -dr com.apple.quarantine orbit64\`"
            echo "(or right-click the executable, Open) before starting it the first time."
          } > notes.md
          gh release create "$ver" dist/* --target "$GITHUB_SHA" --title "Orbit64 $ver" --notes-file notes.md --latest
