# Builds Orbit64 for macOS, Linux and Windows on every push.
#
#   push to main     -> a new release v<major>.<minor>.<commits on main>; major.minor
#                       come from project(VERSION) in CMakeLists.txt
#   push of a v* tag -> a release for that tag (e.g. v2.0.0)
#   any other push   -> (nightly and every other branch) binaries only as workflow
#                       artifacts in the Actions tab, kept 14 days, no release page
#
# SDL3 is built from source and linked statically, so every archive holds a
# single self-contained executable.
name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
    # The project page (pages.yml) doesn't need a build or a release.
    paths-ignore: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  # Never cancel a main run halfway through publishing its release.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-universal
            os: macos-14
            shell: bash
            configure: >-
              -G Ninja
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
            exe: out/orbit64
          - name: linux-x64
            os: ubuntu-22.04
            shell: bash
            configure: >-
              -G Ninja
              -DCMAKE_C_COMPILER=gcc-12
              -DCMAKE_CXX_COMPILER=g++-12
              "-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"
            exe: out/orbit64
          # MinGW-w64 (GCC) as with the Makefile: the core uses GCC builtins MSVC lacks.
          - name: windows-x64
            os: windows-2022
            shell: msys2 {0}
            configure: >-
              -G Ninja
              -DCMAKE_EXE_LINKER_FLAGS=-static
            exe: out/orbit64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install MinGW-w64 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build gcc-12 g++-12 \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
            libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev

      - name: Configure
        run: >-
          cmake -S . -B out
          -DCMAKE_BUILD_TYPE=Release
          -DORBIT64_VENDOR_SDL3=ON
          -DORBIT64_SDL3_STATIC=ON
          ${{ matrix.configure }}

      - name: Build
        run: cmake --build out --config Release --parallel

      - name: Package
        run: |
          mkdir -p dist/orbit64
          cp "${{ matrix.exe }}" README.md dist/orbit64/
          mkdir -p dist/orbit64/roms && cp roms/README.md dist/orbit64/roms/
          cd dist
          case "${{ runner.os }}" in
            Linux)   tar -czf orbit64-${{ matrix.name }}.tar.gz orbit64 ;;
            macOS)   ditto -c -k --keepParent orbit64 orbit64-${{ matrix.name }}.zip ;;
            Windows) cmake -E tar cf orbit64-${{ matrix.name }}.zip --format=zip orbit64 ;;
          esac
          ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: orbit64-${{ matrix.name }}
          path: dist/orbit64-${{ matrix.name }}.*
          retention-days: 14

  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ver="$GITHUB_REF_NAME"
          else
            base=$(sed -nE 's/^project\(orbit64 VERSION ([0-9]+)\.([0-9]+).*/\1.\2/p' CMakeLists.txt)
            ver="v${base}.$(git rev-list --count "$GITHUB_SHA")"
          fi
          if gh release view "$ver" > /dev/null 2>&1; then
            # Re-run of the same commit: refresh the binaries only.
            gh release upload "$ver" dist/* --clobber
            exit 0
          fi
          prev=$(git tag --list 'v*' --sort=-v:refname --merged "$GITHUB_SHA" | grep -vx "$ver" | head -1 || true)
          {
            echo "Built from \`$(git rev-parse --short "$GITHUB_SHA")\` on $(date -u '+%Y-%m-%d')."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then
              git log --no-merges --max-count=100 --format='- %s (%h)' "$prev..$GITHUB_SHA"
            else
              git log -1 --format='- %s (%h)' "$GITHUB_SHA"
            fi
            echo
            echo "### Downloads"
            echo "| Platform | File |"
            echo "|---|---|"
            echo "| Windows 10/11 x64 | \`orbit64-windows-x64.zip\` |"
            echo "| macOS 11+ (Apple Silicon and Intel) | \`orbit64-macos-universal.zip\` |"
            echo "| Linux x64 (glibc 2.35+, e.g. Ubuntu 22.04+) | \`orbit64-linux-x64.tar.gz\` |"
            echo
            echo "macOS: the binary is not notarized. After unpacking run \`xattr -dr com.apple.quarantine orbit64\`"
            echo "(or right-click the executable, Open) before starting it the first time."
          } > notes.md
          gh release create "$ver" dist/* --target "$GITHUB_SHA" --title "Orbit64 $ver" --notes-file notes.md --latest
